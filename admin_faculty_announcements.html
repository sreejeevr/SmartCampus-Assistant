<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Faculty Announcements - SmartCampus</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">


    <style>

        :root{

            --sc-bg:#f6f8fc;
            --sc-surface:#ffffff;
            --sc-surface-2:#f8fafc;
            --sc-text:#172033;
            --sc-muted:#64748b;
            --sc-border:#e2e8f0;
            --sc-primary:#4f46e5;

        }


        *{
            box-sizing:border-box;
        }


        html,
        body{
            min-height:100%;
        }


        body{

            background:var(--sc-bg)!important;

            color:var(--sc-text);

            transition:
                background-color .2s ease,
                color .2s ease;

        }


        /* =========================================
           THEME BUTTON
        ========================================= */

        .sc-theme-toggle{

            width:42px;
            height:42px;
            min-width:42px;

            border:1px solid var(--sc-border);

            border-radius:11px;

            display:inline-flex;

            align-items:center;

            justify-content:center;

            background:var(--sc-surface);

            color:var(--sc-text);

            cursor:pointer;

            padding:0;

            font-size:18px;

            box-shadow:
                0 3px 10px rgba(15,23,42,.08);

        }


        .sc-theme-toggle:hover{

            background:var(--sc-primary);

            border-color:var(--sc-primary);

            color:#fff;

        }


        /* =========================================
           DARK MODE
        ========================================= */

        body.sc-dark-mode{

            --sc-bg:#0b1120;
            --sc-surface:#111827;
            --sc-surface-2:#172033;
            --sc-text:#f1f5f9;
            --sc-muted:#a8b3c5;
            --sc-border:#293548;
            --sc-primary:#818cf8;

            background:var(--sc-bg)!important;

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .bg-light,
        body.sc-dark-mode .bg-white{

            background-color:var(--sc-surface)!important;

        }


        body.sc-dark-mode .text-muted{

            color:var(--sc-muted)!important;

        }


        body.sc-dark-mode .text-dark,
        body.sc-dark-mode .text-body,
        body.sc-dark-mode h1,
        body.sc-dark-mode h2,
        body.sc-dark-mode h3,
        body.sc-dark-mode h4,
        body.sc-dark-mode h5,
        body.sc-dark-mode h6,
        body.sc-dark-mode .fw-bold,
        body.sc-dark-mode .fw-semibold{

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .navbar,
        body.sc-dark-mode nav.navbar{

            background:var(--sc-surface)!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .navbar-brand{

            color:#a5b4fc!important;

        }


        body.sc-dark-mode .nav-link{

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .card,
        body.sc-dark-mode .modal-content,
        body.sc-dark-mode .list-group-item{

            background:var(--sc-surface)!important;

            color:var(--sc-text)!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .card-header,
        body.sc-dark-mode .card-footer,
        body.sc-dark-mode .modal-header,
        body.sc-dark-mode .modal-footer{

            background:var(--sc-surface-2)!important;

            color:var(--sc-text)!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .form-control,
        body.sc-dark-mode .form-select,
        body.sc-dark-mode textarea,
        body.sc-dark-mode input{

            background:#0f172a!important;

            color:var(--sc-text)!important;

            border-color:#334155!important;

        }


        body.sc-dark-mode .form-control::placeholder,
        body.sc-dark-mode textarea::placeholder{

            color:#7f8da3!important;

        }


        body.sc-dark-mode .form-label{

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .table{

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .table>:not(caption)>*>*{

            color:var(--sc-text)!important;

            background:transparent!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .table-hover>tbody>tr:hover>*{

            background:rgba(129,140,248,.08)!important;

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .dropdown-menu{

            background:#111827!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .dropdown-item{

            color:var(--sc-text)!important;

        }


        body.sc-dark-mode .dropdown-item:hover{

            background:#1e293b!important;

            color:#fff!important;

        }


        body.sc-dark-mode .btn-light,
        body.sc-dark-mode .btn-outline-secondary{

            color:var(--sc-text)!important;

            background:transparent!important;

            border-color:#475569!important;

        }


        body.sc-dark-mode .btn-outline-primary{

            color:#a5b4fc!important;

            border-color:#6366f1!important;

        }


        body.sc-dark-mode .alert-light{

            color:var(--sc-text)!important;

            background:var(--sc-surface-2)!important;

        }


        body.sc-dark-mode footer,
        body.sc-dark-mode .sms-footer{

            background:#0f172a!important;

            color:#94a3b8!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .sms-sidebar{

            background:var(--sc-surface)!important;

            border-color:var(--sc-border)!important;

        }


        body.sc-dark-mode .sms-sidebar .text-muted{

            color:var(--sc-muted)!important;

        }


        body.sc-dark-mode .sms-nav-link{

            color:var(--sc-muted)!important;

        }


        body.sc-dark-mode .sms-nav-link:hover,
        body.sc-dark-mode .sms-nav-link.active{

            color:#a5b4fc!important;

            background:#172033!important;

        }


        body.sc-dark-mode .sms-user,
        body.sc-dark-mode .page-header,
        body.sc-dark-mode .announcement-card,
        body.sc-dark-mode .student-card{

            color:var(--sc-text)!important;

        }


        /* =========================================
           SIDEBAR
        ========================================= */

        .admin-sidebar{

            min-height:calc(100vh - 56px);

            display:flex;

            flex-direction:column;

        }


        .admin-sidebar-inner{

            min-height:calc(100vh - 56px);

            display:flex;

            flex-direction:column;

            padding:1rem;

        }


        .admin-sidebar-nav{

            display:flex;

            flex-direction:column;

            gap:4px;

        }


        .admin-sidebar .nav-link{

            border-radius:8px;

            padding:9px 10px;

        }


        .admin-sidebar .nav-link.active{

            color:#fff!important;

            background:var(--sc-primary)!important;

        }


        /* =========================================
           LOGOUT AT BOTTOM
        ========================================= */

        .admin-sidebar-logout{

            margin-top:auto;

            padding-top:20px;

        }


        .admin-sidebar-logout a{

            display:block;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media(max-width:991.98px){

            .admin-sidebar{

                min-height:auto;

            }


            .admin-sidebar-inner{

                min-height:auto;

            }


            .admin-sidebar-logout{

                margin-top:20px;

            }

        }

    </style>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- Favicon -->

    <link rel="icon"
          type="image/svg+xml"
          href="{{ url_for('static', filename='icon.svg') }}">


    <!-- Manifest -->

    <link rel="manifest"
          href="{{ url_for('static', filename='manifest.json') }}">


    <meta name="theme-color"
          content="#4f46e5">


    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

</head>


<body class="">


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar bg-white shadow-sm border-bottom sticky-top">

    <div class="container-fluid px-4">


        <a class="navbar-brand fw-bold text-primary"
           href="{{ url_for('admin_dashboard') }}">

            <i class="bi bi-shield-lock-fill me-2"></i>

            SmartCampus

        </a>


        <div class="d-flex align-items-center gap-2">


            <span class="fw-semibold">

                System Administrator

            </span>


            <span class="badge bg-dark">

                Admin

            </span>


            <!-- TOP LOGOUT -->

            <a href="{{ url_for('logout') }}"
               class="btn btn-outline-danger btn-sm">

                <i class="bi bi-box-arrow-right me-1"></i>

                Logout

            </a>


        </div>

    </div>

</nav>



<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container-fluid">

    <div class="row">


        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside class="col-lg-2 p-0 border-end bg-white admin-sidebar">


            <div class="admin-sidebar-inner">


                <!-- ADMIN PORTAL -->

                <div>

                    <div class="fw-bold mb-3">

                        Admin Portal

                    </div>


                    <!-- DASHBOARD -->

                    <a href="{{ url_for('admin_dashboard') }}"
                       class="nav-link mb-2">

                        <i class="bi bi-grid me-2"></i>

                        Dashboard

                    </a>


                    <!-- FACULTY ANNOUNCEMENTS -->

                    <a href="{{ url_for('admin_faculty_announcements') }}"
                       class="nav-link active">

                        <i class="bi bi-megaphone me-2"></i>

                        Faculty Announcements

                    </a>

                </div>


                <!-- =====================================
                     LOGOUT AT BOTTOM
                ====================================== -->

                <div class="admin-sidebar-logout">

                    <a href="{{ url_for('logout') }}"
                       class="nav-link text-danger">

                        <i class="bi bi-box-arrow-right me-2"></i>

                        Logout

                    </a>

                </div>


            </div>

        </aside>



        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="col-lg-10 p-3 p-md-4">


            <!-- PAGE HEADER -->

            <div class="mb-4">


                <h2 class="fw-bold">

                    Faculty Announcements

                </h2>


                <p class="text-muted">

                    Send a private announcement to one faculty member or all faculty.

                </p>


            </div>



            <!-- =====================================
                 ANNOUNCEMENT FORM
            ====================================== -->

            <div class="card border-0 shadow-sm">


                <div class="card-body">


                    <form method="POST"
                          action="{{ url_for('admin_faculty_announcements') }}">


                        <!-- FACULTY -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Faculty

                            </label>


                            <select name="faculty_id"
                                    class="form-select"
                                    required>


                                <option value="">

                                    Select Faculty

                                </option>


                                <option value="ALL">

                                    All Faculty

                                </option>


                                {% for member in faculty|default([]) %}

                                <option value="{{ member.id }}">

                                    {{ member.name }}

                                    {% if member.subject %}

                                        — {{ member.subject }}

                                    {% endif %}

                                    — {{ member.email }}

                                </option>

                                {% endfor %}


                            </select>

                        </div>



                        <!-- TITLE -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Title

                            </label>


                            <input name="title"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- MESSAGE -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Message

                            </label>


                            <textarea name="message"
                                      class="form-control"
                                      rows="6"
                                      required></textarea>

                        </div>



                        <!-- SEND -->

                        <button class="btn btn-primary">

                            <i class="bi bi-send me-1"></i>

                            Send Announcement

                        </button>


                    </form>

                </div>

            </div>


        </main>

    </div>

</div>



<!-- =========================================
     BOOTSTRAP JS
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



<!-- =========================================
     THEME SCRIPT
========================================= -->

<script>

(function(){

    const KEY = "smartcampus-theme";


    function setTheme(theme){

        const dark = theme === "dark";


        document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light"
        );


        document.body.classList.toggle(
            "sc-dark-mode",
            dark
        );


        localStorage.setItem(
            KEY,
            dark ? "dark" : "light"
        );


        document
            .querySelectorAll(".sc-theme-toggle")
            .forEach(function(btn){

                btn.innerHTML = dark

                    ? '<i class="bi bi-sun-fill"></i>'

                    : '<i class="bi bi-moon-stars-fill"></i>';


                btn.title = dark

                    ? "Switch to Light Mode"

                    : "Switch to Dark Mode";


                btn.setAttribute(
                    "aria-label",
                    btn.title
                );

            });

    }



    function addThemeButton(){

        if(
            document.querySelector(".sc-theme-toggle")
        ){

            return;

        }


        const btn =
            document.createElement("button");


        btn.type = "button";


        btn.className =
            "sc-theme-toggle";


        btn.addEventListener(
            "click",
            function(){

                setTheme(

                    document.body.classList.contains(
                        "sc-dark-mode"
                    )

                    ? "light"

                    : "dark"

                );

            }
        );


        const target =

            document.querySelector(
                ".sms-navbar .d-flex.align-items-center"
            )

            ||

            document.querySelector(
                ".navbar .d-flex.align-items-center"
            )

            ||

            document.querySelector(
                "nav .d-flex.align-items-center"
            )

            ||

            document.querySelector(
                ".topbar .d-flex.align-items-center"
            );


        if(target){

            target.insertBefore(
                btn,
                target.firstChild
            );

        }

        else{

            btn.style.position = "fixed";

            btn.style.top = "18px";

            btn.style.right = "20px";

            btn.style.zIndex = "99999";

            document.body.appendChild(btn);

        }

    }



    function init(){

        setTheme(

            localStorage.getItem(KEY) === "dark"

                ? "dark"

                : "light"

        );


        addThemeButton();


        setTheme(

            localStorage.getItem(KEY) === "dark"

                ? "dark"

                : "light"

        );

    }



    if(
        document.readyState === "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            init
        );

    }

    else{

        init();

    }

})();

</script>



<script src="{{ url_for('static', filename='js/ui.js') }}"></script>


</body>

</html>
